spring:
  application:
    name: order-management
  datasource:
    url: jdbc:h2:mem:ordermanagement;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
logistics:
  base-url: ${LOGISTICS_BASE_URL:http://localhost:9090}
  token: ${LOGISTICS_TOKEN:}
  connect-timeout: 2s
  read-timeout: 6s
  max-retries: 2
  retry-backoff: 300ms
